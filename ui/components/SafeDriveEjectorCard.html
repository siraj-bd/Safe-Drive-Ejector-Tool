<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Safe Drive Ejector Tool</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      user-select: none;
    }

    /* ==========================================================================
       MAIN CARD CONTAINER (fast-rabbit-51 by dzoshi)
       Strict outer boundary: nothing inside or behind peeks outside!
       ========================================================================== */
    .card {
      position: relative;
      width: 192px;
      min-height: 316px;
      background: linear-gradient(-45deg, #161616 0%, #000000 100%);
      color: #81818144;
      display: flex;
      flex-direction: column;
      padding: 6px 6px;
      gap: 2.5px;
      border-radius: 10px;
      border: 1.5px solid #ff1a1a;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6), 0 0 12px rgba(255, 26, 26, 0.25);
      overflow: hidden; /* CRITICAL: Outer boundary clips all background and pseudo-layers */
      box-sizing: border-box;
      cursor: pointer;
    }

    /* Contained water-colour / blur background layer strictly inside & behind card content */
    .card-watercolor-bg {
      position: absolute;
      inset: 2px;
      border-radius: 8px;
      background: radial-gradient(circle at 50% 15%, rgba(255, 59, 48, 0.12), rgba(86, 40, 238, 0.08) 50%, rgba(18, 18, 19, 0.75) 100%);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      pointer-events: none;
      z-index: 0;
      transition: all 0.3s ease;
    }

    .card:hover .card-watercolor-bg {
      background: radial-gradient(circle at 50% 25%, rgba(255, 59, 48, 0.18), rgba(86, 40, 238, 0.12) 60%, rgba(18, 18, 19, 0.85) 100%);
    }

    /* ==========================================================================
       MENUBAR SPECIFIC ADJUSTMENTS (1X, 1.25X, 1.5X)
       Guarantees zero background/white/blur layer bleed via clip & mask
       ========================================================================== */
    body.menubar-scale-1 .card,
    body.menubar-scale-1-25 .card,
    body.menubar-scale-1-5 .card {
      clip-path: inset(0 round 10px);
      -webkit-clip-path: inset(0 round 10px);
      -webkit-mask-image: -webkit-radial-gradient(white, black);
      overflow: hidden;
      box-sizing: border-box;
    }

    body.menubar-scale-1 .card-watercolor-bg,
    body.menubar-scale-1-25 .card-watercolor-bg,
    body.menubar-scale-1-5 .card-watercolor-bg {
      inset: 4px;
      border-radius: 6px;
      clip-path: inset(0 round 6px);
      -webkit-clip-path: inset(0 round 6px);
      -webkit-mask-image: -webkit-radial-gradient(white, black);
      pointer-events: none;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(180deg, rgba(255,0,0,0.15) 0%, rgba(216,0,0,0.05) 50%, rgba(255,0,0,0.15) 100%);
      z-index: 0;
      pointer-events: none;
      transition: all 0.4s ease;
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      box-shadow: inset 0 0 8px rgba(255, 26, 26, 0.2);
      pointer-events: none;
      z-index: 0;
    }

    .card:hover::before {
      background: linear-gradient(180deg, rgba(255,0,0,0.25) 0%, rgba(216,0,0,0.1) 50%, rgba(255,0,0,0.25) 100%);
    }

    .github-header-btn,
    .status-container,
    .drivers-section,
    .grid-section,
    .footer-brand {
      position: relative;
      z-index: 1;
    }

    /* ==========================================================================
       HEADER: GITHUB UI (unlucky-rattlesnake-65 by elijahgummer)
       Text center-justified in the middle!
       ========================================================================== */
    @keyframes rainbowGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .github-header-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 22px;
      padding: 0 4px;
      border-radius: 4px;
      border: 1px solid transparent;
      background: linear-gradient(#121213, #121213) padding-box,
                  linear-gradient(90deg, #ff3b30, #ff9500, #ffcc00, #34c759, #007aff, #af52de, #ff2d55) border-box;
      background-size: 200% 200%;
      animation: rainbowGlow 4s linear infinite;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
    }

    /* Rainbow bottom glow */
    .github-header-btn::after {
      content: "";
      position: absolute;
      bottom: -2.5px;
      left: 10%;
      width: 80%;
      height: 4px;
      background: linear-gradient(90deg, #ff3b30, #ff9500, #34c759, #007aff, #af52de);
      background-size: 200% 200%;
      animation: rainbowGlow 4s linear infinite;
      filter: blur(3px);
      opacity: 0.7;
      z-index: -1;
    }

    .gh-left-clickable {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      cursor: pointer;
      text-decoration: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      flex-shrink: 0;
    }
    .gh-left-clickable:hover {
      opacity: 0.85;
      transform: scale(1.08);
    }

    .gh-icon-svg {
      width: 11px;
      height: 11px;
      fill: #ffffff;
    }

    /* Center-justified title */
    .gh-center-title {
      flex: 1;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 7.2px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.15px;
      white-space: nowrap;
      padding: 0 2px;
    }

    .gh-star-clickable {
      display: flex;
      align-items: center;
      gap: 2px;
      padding: 1px 3px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .gh-star-clickable:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: scale(1.05);
    }

    .gh-star-icon {
      width: 8.5px;
      height: 8.5px;
      fill: #a0a6b2;
      transition: fill 0.2s ease, transform 0.2s ease;
    }
    .gh-star-clickable:hover .gh-star-icon,
    .gh-star-clickable.starred .gh-star-icon {
      fill: #ffcc00;
      filter: drop-shadow(0 0 3px rgba(255, 204, 0, 0.8));
    }

    .gh-star-count {
      font-size: 7px;
      font-weight: 800;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
    }

    /* ==========================================================================
       STATUS SECTION (From User Reference: 3-line layout with Red SSD + ⏳)
       ========================================================================== */
    .status-container {
      background: rgba(18, 18, 22, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 4px;
      padding: 3.5px 6px 4px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      width: 100%;
      box-sizing: border-box;
      position: relative;
    }

    /* Pager Zone: Positioned on the left of Status title, shifted slightly down */
    .status-pager-zone {
      position: absolute;
      left: 8px;
      top: calc(50% + 1.5px);
      transform: translateY(-50%);
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 60;
    }

    /* Top Bar: Status Title centered with Size Scale Selector on right */
    .status-top-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      width: 100%;
    }

    .status-title {
      font-size: 8px;
      font-weight: 700;
      color: #ffffff;
      text-decoration: underline;
      text-underline-offset: 2px;
      letter-spacing: 0.2px;
      line-height: 1;
      text-align: center;
    }

    .status-size-wrap {
      display: flex;
      align-items: center;
      gap: 2px;
      justify-self: end;
    }

    .size-label {
      font-size: 6.2px;
      color: rgba(255, 255, 255, 0.6);
      font-weight: 600;
    }

    .size-select {
      width: 28px;
      height: 12px;
      font-size: 6.5px;
      font-weight: 700;
      padding: 0;
      background: #0f0f11;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      color: #ff3333;
      cursor: pointer;
      outline: none;
      text-align: center;
      line-height: 12px;
    }
    .size-select:hover, .size-select:focus {
      border-color: #ff3333;
      box-shadow: 0 0 4px rgba(255, 51, 51, 0.4);
    }

    /* Bottom Row: Animated Icon on Left, Two Text lines on Right (Hidden by default, active on unmount/eject) */
    .status-body-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      width: 100%;
      min-height: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .status-body-row.active {
      opacity: 1;
      pointer-events: auto;
    }

    .status-loader-wrap {
      width: 14px;
      height: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .loader-scaler {
      transform: scale(0.26);
      transform-origin: center center;
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 0 2px rgba(255, 25, 25, 0.6));
    }

    .loader {
      width: 44px;
      aspect-ratio: 1.154;
      position: relative;
      background: conic-gradient(from 120deg at 50% 64%, #0000, #ff1919 1deg 120deg, #0000 121deg);
      animation: l27-0 1.5s infinite cubic-bezier(0.3, 1, 0, 1);
    }

    .loader:before,
    .loader:after {
      content: '';
      position: absolute;
      inset: 0;
      background: inherit;
      transform-origin: 50% 66%;
      animation: l27-1 1.5s infinite;
    }

    .loader:after {
      --s: -1;
    }

    @keyframes l27-0 {
      0%, 30% {
        transform: rotate(0);
      }
      70% {
        transform: rotate(120deg);
      }
      70.01%, 100% {
        transform: rotate(360deg);
      }
    }

    @keyframes l27-1 {
      0% {
        transform: rotate(calc(var(--s, 1) * 120deg)) translate(0);
      }
      30%, 70% {
        transform: rotate(calc(var(--s, 1) * 120deg)) translate(calc(var(--s, 1) * -5px), 10px);
      }
      100% {
        transform: rotate(calc(var(--s, 1) * 120deg)) translate(0);
      }
    }

    .status-text-group {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 1px;
    }

    .status-processing-text {
      font-size: 5.6px;
      color: #ffffff;
      font-weight: 600;
      letter-spacing: 0.1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.15;
      text-align: left;
    }

    .status-mode-text {
      font-size: 5.0px;
      color: rgba(255, 255, 255, 0.85);
      font-weight: 400;
      letter-spacing: 0.1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.15;
      text-align: left;
    }

    /* ==========================================================================
       DRIVERS LIST SECTION (Slimmer Rows, Reduced Gap)
       ========================================================================== */
    .drivers-section {
      background: rgba(18, 18, 20, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      padding: 3px 4px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .drivers-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2px;
      padding-bottom: 2px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .drivers-header-left {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .drivers-title {
      font-size: 7.5px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.1px;
    }

    .drivers-page-badge {
      font-size: 5.8px;
      font-weight: 700;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.28);
      border-radius: 2px;
      padding: 0.5px 2.5px;
      line-height: 1;
      letter-spacing: 0.2px;
    }

    /* ==========================================================================
       PAGER BUTTON: Above Drivers List on the Left
       Aligned strictly with the checkbox column boundary (never goes to the left)
       ========================================================================== */
    /* ==========================================================================
       PAGER BUTTON (From Uiverse.io by Zaikonurami / Zaiko / Aaron Iker)
       Color: Green (#22c55e), compact text, smooth 45deg rotation on expand
       ========================================================================== */
    :root {
      --button-color: #22c55e;
      --icons-color: #ffffff;
      --plus-color: #ffffff;
      --scale: 1;
    }

    .add-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    /* --- Button --- */
    .add {
      width: 84px;
      height: 84px;
      position: relative;
      display: grid;
      grid-template-columns: 42px 42px;
      grid-template-rows: 42px 42px;
      grid-auto-flow: column;
      transform: scale(0.195);
      transform-origin: 50% 50%;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      z-index: 60;
      flex-shrink: 0;
      box-sizing: border-box;
    }

    .add a {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 42px;
      height: 42px;
      box-sizing: border-box;
      background: var(--button-color, #22c55e);
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      transition:
        border-radius 0.3s ease,
        transform 0.2s ease,
        background 0.2s ease;
      text-decoration: none;
    }

    .add a .pager-text {
      display: flex;
      align-items: center;
      justify-content: center;
      position: absolute;
      left: 50%;
      top: 50%;
      width: 100%;
      height: 100%;
      margin: 0;
      opacity: 0;
      color: var(--icons-color, #ffffff);
      font-size: 23px;
      font-weight: 900;
      line-height: 1;
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0.6) rotate(-45deg);
      transition: all 0.15s ease;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
    }

    /* Corner Radii */
    .add a:nth-child(1) {
      border-radius: 8px 0 0 0;
    }
    .add a:nth-child(2) {
      border-radius: 0 0 0 8px;
    }
    .add a:nth-child(3) {
      border-radius: 0 8px 0 0;
    }
    .add a:nth-child(4) {
      border-radius: 0 0 8px 0;
    }

    /* The Plus Sign (+) */
    .add:before,
    .add:after {
      content: "";
      width: 30px;
      height: 7px;
      border-radius: 3.5px;
      background: var(--plus-color, #ffffff);
      position: absolute;
      left: 50%;
      top: 50%;
      display: block;
      z-index: 1;
      transform-origin: 50% 50%;
      transition:
        transform 0.25s ease,
        opacity 0.25s ease;
      pointer-events: none;
    }

    .add:before {
      transform: translate(-50%, -50%) scaleY(0.76);
    }

    .add:after {
      transform: translate(-50%, -50%) rotate(90deg) scaleY(0.76);
    }

    /* --- Hover State (Expanded: Contained strictly within status zone) --- */
    .add:hover,
    .add.expanded {
      transform: scale(0.255) rotate(45deg);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1) 0.05s;
      z-index: 100;
    }

    .add:hover:before,
    .add:hover:after,
    .add.expanded:before,
    .add.expanded:after {
      opacity: 0;
      transform: translate(-50%, -50%) rotate(0deg) scale(0);
      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .add:hover a,
    .add.expanded a {
      --scale: 1;
      pointer-events: auto;
      border-radius: 50%;
      animation: pointerEvent 0s linear forwards 0.35s;
      transition:
        border-radius 0.15s ease 0.08s,
        transform 0.22s ease 0.12s;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.7);
    }

    /* Transform */
    .add:hover a:nth-child(1),
    .add.expanded a:nth-child(1) {
      transform: translate(-5px, -5px) scale(var(--scale));
    }
    .add:hover a:nth-child(2),
    .add.expanded a:nth-child(2) {
      transform: translate(-5px, 5px) scale(var(--scale));
    }
    .add:hover a:nth-child(3),
    .add.expanded a:nth-child(3) {
      transform: translate(5px, -5px) scale(var(--scale));
    }
    .add:hover a:nth-child(4),
    .add.expanded a:nth-child(4) {
      transform: translate(5px, 5px) scale(var(--scale));
    }

    .add:hover a .pager-text,
    .add.expanded a .pager-text {
      opacity: 1;
      transition: all 0.25s ease 0.15s;
      transform: translate(-50%, -50%) scale(1) rotate(-45deg);
    }

    .add:hover a:hover,
    .add.expanded a:hover {
      --scale: 0.92;
      background: #16a34a !important;
      transition:
        border-radius 0.2s ease 0.1s,
        transform 0.25s ease 0s;
    }

    .add:hover a:hover .pager-text,
    .add.expanded a:hover .pager-text {
      opacity: 1;
      transition: all 0.3s ease 0s;
    }

    .add a.active {
      background: #15803d !important;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.9) !important;
    }

    @keyframes pointerEvent {
      100% {
        pointer-events: auto;
      }
    }

    .driver-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 15px;
      gap: 4px;
    }

    .driver-name-wrap {
      display: flex;
      align-items: center;
      gap: 3px;
      flex: 1;
      min-width: 0;
    }

    /* Custom Red Checkbox (Checked = Red with white tick, Unchecked = Black with NO tick) */
    .custom-checkbox {
      position: relative;
      width: 9.5px;
      height: 9.5px;
      background: #ff1a1a;
      border: 1px solid #ff3333;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 1px 3px rgba(255, 26, 26, 0.5);
      transition: all 0.15s ease;
      flex-shrink: 0;
      box-sizing: border-box;
    }
    .custom-checkbox:hover {
      filter: brightness(1.18);
      transform: scale(1.08);
    }
    .custom-checkbox.unchecked {
      background: #000000 !important;
      border: 1px solid rgba(255, 255, 255, 0.3) !important;
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.9) !important;
    }
    .custom-checkbox .check-svg {
      width: 6.5px;
      height: 6.5px;
      stroke: #ffffff;
      stroke-width: 2.5;
      fill: none;
      display: block;
    }
    .custom-checkbox.unchecked .check-svg {
      display: none !important;
    }

    .driver-name-text {
      font-size: 7.2px;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      cursor: pointer;
    }

    /* Drive Hover Details Tooltip Popup - Strictly Contained Inside .card */
    .drive-hover-popup {
      position: absolute;
      left: 6px;
      right: 6px;
      width: calc(100% - 12px);
      box-sizing: border-box;
      z-index: 99999;
      pointer-events: none;
      background: rgba(12, 16, 24, 0.98);
      border: 1px solid rgba(255, 65, 65, 0.7);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.85), 0 0 14px rgba(255, 65, 65, 0.35);
      border-radius: 6px;
      padding: 5px 7px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 7.2px;
      color: #e2e8f0;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      opacity: 0;
      visibility: hidden;
      transform: translateY(2px);
      transition: opacity 0.15s ease, transform 0.15s ease, visibility 0.15s;
    }
    .drive-hover-popup.visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    .popup-title {
      font-weight: 700;
      color: #ffffff;
      font-size: 8px;
      margin-bottom: 2px;
      letter-spacing: 0.15px;
      word-break: break-word;
      line-height: 1.25;
    }
    .popup-divider {
      height: 1px;
      background: linear-gradient(90deg, rgba(255, 75, 75, 0.9) 0%, rgba(255, 255, 255, 0.15) 100%);
      margin: 2.5px 0 4px 0;
    }
    .popup-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 2px;
      line-height: 1.35;
    }
    .popup-label {
      color: #94a3b8;
      font-size: 6.8px;
      flex-shrink: 0;
      text-transform: capitalize;
    }
    .popup-val {
      color: #f1f5f9;
      font-weight: 500;
      font-size: 7.2px;
      text-align: right;
      word-break: break-all;
    }
    .popup-row.vertical-wrap {
      flex-direction: column;
      align-items: flex-start;
      gap: 1.5px;
    }
    .popup-val.val-path {
      text-align: left;
      word-break: break-all;

    /* ==========================================================================
       FUNCTIONAL BUTTON (rare-earwig-4 by dissojak) - Slim & Gentle Slide
       ========================================================================== */
    .bookmarkBtn {
      height: 15px;
      border-radius: 2.5px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background-color: #0c0c0c;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      cursor: pointer;
      transition: border-color 0.9s cubic-bezier(0.16, 1, 0.3, 1),
                  box-shadow 0.9s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      overflow: hidden;
      position: relative;
    }

    .bookmarkBtn.mount-btn {
      width: 42px;
    }

    .bookmarkBtn.unmount-btn {
      width: 51px;
    }

    .IconContainer {
      width: 12px;
      height: 12px;
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 2;
      transition: width 0.9s cubic-bezier(0.16, 1, 0.3, 1);
      margin-left: 1px;
      flex-shrink: 0;
    }

    .IconContainer svg {
      width: 7px;
      height: 7px;
      fill: #ffffff;
    }

    /* Mount Color (#64FD1F Neon Lime Green) */
    .bookmarkBtn.mount-btn .IconContainer {
      background: linear-gradient(135deg, #64FD1F 0%, #4ae30e 100%);
      box-shadow: 0 0 5px rgba(100, 253, 31, 0.4);
    }
    .bookmarkBtn.mount-btn .IconContainer svg {
      fill: #000000;
    }

    /* Unmount Color (Card Matching Red) */
    .bookmarkBtn.unmount-btn .IconContainer {
      background: linear-gradient(135deg, #ff0000 0%, #d80000 100%);
      box-shadow: 0 0 5px rgba(255, 0, 0, 0.4);
    }
    .bookmarkBtn.unmount-btn .IconContainer svg {
      fill: #ffffff;
    }

    .bookmarkBtn.mount-btn:hover {
      border-color: rgba(100, 253, 31, 0.5);
    }

    .bookmarkBtn.unmount-btn:hover {
      border-color: rgba(255, 0, 0, 0.5);
    }

    .bookmarkBtn .text {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      z-index: 1;
      transition: transform 0.9s cubic-bezier(0.16, 1, 0.3, 1),
                  opacity 0.75s cubic-bezier(0.16, 1, 0.3, 1),
                  width 0.9s cubic-bezier(0.16, 1, 0.3, 1);
      font-size: 6.5px;
      font-weight: 600;
      letter-spacing: 0.1px;
      padding: 0 1px 0 2px;
      white-space: nowrap;
      flex: 1;
    }

    /* Gentle hover animation: Icon gently expands across button, text slides out */
    .bookmarkBtn.mount-btn:hover .IconContainer {
      width: 38px;
    }

    .bookmarkBtn.unmount-btn:hover .IconContainer {
      width: 47px;
    }

    .bookmarkBtn:hover .text {
      transform: translateX(10px);
      width: 0;
      opacity: 0;
      font-size: 0;
      padding: 0;
    }

    .bookmarkBtn:active {
      transform: scale(0.94);
      transition: transform 0.22s ease;
    }

    /* ==========================================================================

       ========================================================================== */
    .grid-section {

      grid-template-columns: 1fr 1fr;
      gap: 2px;
      padding: 0 5px;
    }

    .control-card {

      overflow: hidden;

    /* ==========================================================================
       3D RAISED CHROME TEXT WATERMARK (matching user image "GET STARTED")
       Directly on card background (no box), heavy 3D extrusion, dark perimeter,
       warm metallic under-rim reflection, and smooth shine sweep loop.
       ========================================================================== */
    /* ==========================================================================
       SIRAJ-BD WATERMARK (Deep-Punched Metal Carving matching media_1790034518171.png)
       Straight front-facing, deeply punched into card surface, silver inside,
       crisp silver-beveled bottom edge, top drop-in shadow, NO outer box.
       ========================================================================== */
    @keyframes punchedSilverShine {
      0% {
        background-position: 100% 0;
      }
      100% {
        background-position: -100% 0;
      }
    }

    .logout-cell {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      height: 19px;
      padding-left: 2px;
      padding-right: 1px;
      box-sizing: border-box;
    }

    /* Clean container - strictly NO side borders, NO box */
    .punched-watermark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      box-shadow: none;
      padding: 0;
      margin: 0;
      text-decoration: none;
      cursor: pointer;
      user-select: none;
      flex-shrink: 0;
      transition: transform 0.2s ease;
    }

    .punched-watermark:hover {
      transform: scale(1.04);
    }

    /* Deep-punched straight front-facing text (matching reference image) */
    .punched-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 0.35px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      /* Inside the cut: brushed silver with smooth shine sweep */
      background: linear-gradient(
        to right,
        #4b515d 0%,
        #71717a 25%,
        #cbd5e1 45%,
        #ffffff 50%,
        #cbd5e1 55%,
        #71717a 75%,
        #4b515d 100%
      );
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: punchedSilverShine 3.5s linear infinite;
      /* Exact deep punch bevel: dark overhang shadow on top, razor-sharp silver highlight rim on bottom */
      filter: drop-shadow(0 -1.2px 0.5px #000000)
              drop-shadow(0 1px 0 rgba(255, 255, 255, 0.55));
    }

    .Btn-logout {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      width: 15px;
      height: 15px;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition-duration: .3s;
      box-shadow: 1px 1px 5px rgba(0, 0, 0, 0.35);
      background-color: rgb(255, 65, 65);
      flex-shrink: 0;
      margin-left: auto;
    }

    /* sign */
    .Btn-logout .sign {
      width: 100%;
      height: 100%;
      transition-duration: .3s;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .Btn-logout .sign svg {
      width: 7px;
      height: 7px;
    }

    .Btn-logout .sign svg path {
      fill: white;
    }

    /* text */
    .Btn-logout .text-logout {
      position: absolute;
      right: 2px;
      width: 0;
      opacity: 0;
      color: white;
      font-size: 6.2px;
      font-weight: 700;
      letter-spacing: -0.1px;
      transition-duration: .3s;
      white-space: nowrap;
      overflow: hidden;
      line-height: 1;
    }

    /* hover effect on button width - compact 35px */
    .Btn-logout:hover,
    .Btn-logout.expanded {
      width: 35px;
      border-radius: 7.5px;
      transition-duration: .3s;
    }

    .Btn-logout:hover .sign,
    .Btn-logout.expanded .sign {
      width: 11px;
      transition-duration: .3s;
      padding-left: 2.5px;
      justify-content: flex-start;
    }

    /* hover effect button's text - snug fit right next to icon */
    .Btn-logout:hover .text-logout,
    .Btn-logout.expanded .text-logout {
      opacity: 1;
      width: calc(100% - 13.5px);
      transition-duration: .3s;
      padding-right: 2px;
      text-align: center;
    }

    /* button click effect */
    .Btn-logout:active {
      transform: translate(1px, 1px);
    }

    /* ==========================================================================

    }

    <!-- 5. FOOTER BRANDING -->
    <div class="footer-brand">
      <span class="green-accent">Safe Drive</span> <span class="red-accent">Ejector Tool</span>

    <!-- Dynamic Drive Hover Details Tooltip Popup (strictly inside .card container) -->
    <div id="driveHoverPopup" class="drive-hover-popup" style="display: none;"></div>

  </div>

  <script>
    // GitHub Stargazers Sync with Actual Repository Count
    let starCount = 0;
    let isStarred = false;

    function openExternalURL(url, event) {
      if (event) event.preventDefault();
      postToHost({ action: "openURL", url: url });
      try {
        window.open(url, "_blank");
      } catch (e) {}
    }

    function fetchRepoStars() {
      fetch("https://api.github.com/repos/siraj-bd/Safe-Drive-Ejector-Tool")
        .then(res => {
          if (res.ok) return res.json();
          throw new Error("API err");
        })
        .then(data => {
          if (typeof data.stargazers_count === "number") {
            starCount = data.stargazers_count;
            const elem = document.getElementById("starCount");
            if (elem) elem.textContent = starCount;
            localStorage.setItem("SafeDriveEjector_RepoStars", starCount);
          }
        })
        .catch(() => {
          const cached = localStorage.getItem("SafeDriveEjector_RepoStars");
          if (cached) {
            starCount = parseInt(cached, 10);
            const elem = document.getElementById("starCount");
            if (elem) elem.textContent = starCount;
          }
        });
    }

    function handleStarClick(e) {
      if (e) e.stopPropagation();
      const starBtn = document.getElementById("starBtn");
      const starCountElem = document.getElementById("starCount");
      if (!isStarred) {
        isStarred = true;
        starCount++;
        if (starBtn) starBtn.classList.add("starred");
      } else {
        isStarred = false;
        starCount = Math.max(0, starCount - 1);
        if (starBtn) starBtn.classList.remove("starred");
      }
      if (starCountElem) starCountElem.textContent = starCount;
      localStorage.setItem("SafeDriveEjector_RepoStars", starCount);
      localStorage.setItem("SafeDriveEjector_IsStarred", isStarred);
      openExternalURL("https://github.com/siraj-bd/Safe-Drive-Ejector-Tool", e);
    }

    // Initialize stars on load
    fetchRepoStars();

    // Generic checkbox toggle handler (Settings grid)
    function toggleCheckbox(element) {
      element.classList.toggle("unchecked");
      const isChecked = !element.classList.contains("unchecked");
      postToHost({ action: "checkboxToggle", id: element.id, checked: isChecked });
    }

    // Audio Feedback (Web Audio API synthesised soft chime)
    function playAudioFeedback(type = "success") {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        if (type === "success") {
          const osc1 = ctx.createOscillator();
          const osc2 = ctx.createOscillator();
          const gain = ctx.createGain();
          osc1.type = "sine";
          osc2.type = "sine";
          osc1.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
          osc1.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15); // A5
          osc2.frequency.setValueAtTime(880, ctx.currentTime + 0.08); // A5
          osc2.frequency.exponentialRampToValueAtTime(1174.66, ctx.currentTime + 0.28); // D6
          gain.gain.setValueAtTime(0.18, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
          osc1.connect(gain);
          osc2.connect(gain);
          gain.connect(ctx.destination);
          osc1.start();
          osc2.start(ctx.currentTime + 0.08);
          osc1.stop(ctx.currentTime + 0.22);
          osc2.stop(ctx.currentTime + 0.42);
        }
      } catch (e) {}
    }

    // Status Section Processing Controller with continuous animated loop
    let statusHoldTimer = null;
    let processingInterval = null;
    let isProcessingActive = false;

    function startProcessingLoop(actionName = "Processing", targetLabel = "") {
      const bodyRow = document.getElementById("statusBodyRow");
      const procElem = document.getElementById("statusProcessingText");
      const modeElem = document.getElementById("statusModeText");
      if (!bodyRow || !procElem || !modeElem) return;

      isProcessingActive = true;
      bodyRow.classList.add("active");
      clearTimeout(statusHoldTimer);
      if (processingInterval) clearInterval(processingInterval);

      let step = 0;
      const displayLabel = targetLabel ? ` ${targetLabel}` : "";
      const loopStages = [
        "Processing...",
        "Processing.....",
        "Processing.......",
        "Processing..........",
        `${actionName}${displayLabel}...`,
        "Flushing Disk Cache...",
        "Syncing File Buffers...",
        `${actionName}${displayLabel}.....`
      ];

      procElem.textContent = `${actionName}${displayLabel}...`;
      modeElem.textContent = "Disk Operation Running";

      processingInterval = setInterval(() => {
        if (!isProcessingActive) return;
        step = (step + 1) % loopStages.length;
        procElem.textContent = loopStages[step];
      }, 300);

      // Standalone browser fallback simulation if not hosted in Swift WKWebView
      if (!window.webkit || !window.webkit.messageHandlers || !window.webkit.messageHandlers.safeEjectBridge) {
        setTimeout(() => {
          if (isProcessingActive) {
            completeProcessing("Safe to unplug", "Ready");
          }
        }, 3500);
      }
    }

    function completeProcessing(finalMsg = "Ready", subMsg = "Operation Complete") {
      isProcessingActive = false;
      if (processingInterval) {
        clearInterval(processingInterval);
        processingInterval = null;
      }

      const bodyRow = document.getElementById("statusBodyRow");
      const procElem = document.getElementById("statusProcessingText");
      const modeElem = document.getElementById("statusModeText");

      if (procElem) procElem.textContent = finalMsg;
      if (modeElem) modeElem.textContent = subMsg;

      playAudioFeedback("success");
      syncEjectedCount();

      clearTimeout(statusHoldTimer);
      statusHoldTimer = setTimeout(() => {
        if (bodyRow) bodyRow.classList.remove("active");
        if (procElem) procElem.textContent = "Ready";
        if (modeElem) modeElem.textContent = "System Idle";
      }, 2000);
    }

    // Host IPC callback when backend Process begins
    window.onOperationStart = function(cmd, targetParam) {
      const targetLabel = targetParam ? targetParam : "";
      if (cmd === "eject-now") {
        startProcessingLoop("Ejecting Safely", targetLabel || "Selected Drives");
      } else if (cmd === "idle-sleep") {
        startProcessingLoop("Deep Sleep", targetLabel || "LED OFF Mode");
      } else if (cmd === "eject") {
        startProcessingLoop("Unmounting", targetLabel);
      } else if (cmd === "remount" || cmd === "remount-all") {
        startProcessingLoop("Mounting", targetLabel || "Sleeping Drives");
      } else {
        startProcessingLoop("Processing", cmd);
      }
    };

    // Host IPC callback when backend Process completes
    window.onOperationComplete = function(cmd, success) {
      if (cmd === "eject-now") {
        completeProcessing(success ? "Safe to Unplug" : "Eject Incomplete", success ? "Safe Ejection Done" : "Drive In Use");
      } else if (cmd === "idle-sleep") {
        completeProcessing(success ? "LED OFF Sleep" : "Sleep Aborted", success ? "Drive Asleep (LED OFF)" : "Drive Busy");
      } else if (cmd === "eject") {
        completeProcessing(success ? "Volume Unmounted" : "Unmount Failed", success ? "Clean Unmount Done" : "Drive Busy");
      } else if (cmd === "remount" || cmd === "remount-all") {
        completeProcessing(success ? "Drive Mounted" : "Mount Incomplete", success ? "Ready to Access" : "Check Filesystem");
      } else {
        completeProcessing(success ? "Success" : "Failed", "Operation Finished");
      }
    };

    // Scale & Popover Sizing Controller
    let currentScale = 1.0;
    let currentDrives = [];
    let currentDriveOffset = 1;

    function changeCardScale(val) {
      const scale = parseFloat(val) || 1.0;
      currentScale = scale;
      hideDriveHoverPopup();
      localStorage.setItem("SafeDriveEjector_CardScale", scale);

      const select = document.getElementById("cardScaleSelect");
      if (select && select.value !== String(scale)) {
        select.value = String(scale);
      }

      // Track Menubar specific scale classes (1X, 1.25X, 1.5X)
      document.body.classList.remove("menubar-scale-1", "menubar-scale-1-25", "menubar-scale-1-5");
      if (scale === 1.0) {
        document.body.classList.add("menubar-scale-1");
      } else if (scale === 1.25) {
        document.body.classList.add("menubar-scale-1-25");
      } else if (scale === 1.5) {
        document.body.classList.add("menubar-scale-1-5");
      }

      // Apply zoom to document body
      document.body.style.zoom = scale;

      let targetW, targetH;
      if (scale === 1.0) {
        // Individually verified Menubar 1X sizing
        targetW = 192;
        targetH = 316;
      } else if (scale === 1.25) {
        // Individually verified Menubar 1.25X sizing
        targetW = 240;
        targetH = 395;
      } else if (scale === 1.5) {
        // Individually verified Menubar 1.5X sizing
        targetW = 288;
        targetH = 474;
      } else {
        // 2X, 3X, 4X untouched (no modification)
        const baseW = 192;
        const baseH = 316;
        targetW = Math.round(baseW * scale);
        targetH = Math.round(baseH * scale);
      }

      postToHost({ action: "resizePopover", width: targetW, height: targetH });
      renderDriveNames();
    }

    function setDriveOffset(offset, event) {
      if (event) event.stopPropagation();
      currentDriveOffset = Math.max(1, offset);
      updatePagerActiveState();
      renderDriveNames();
    }

    function togglePagerExpanded(event) {
      if (event) event.stopPropagation();
      const pager = document.getElementById("driverPagerBtn");
      if (pager) pager.classList.toggle("expanded");
    }

    function updatePagerActiveState() {
      const badge = document.getElementById("driversPageBadge");
      if (badge) {
        badge.textContent = `${currentDriveOffset}-${currentDriveOffset + 3}`;
      }

      // Dynamic base offset according to user specification:
      // 1 -> 1st, 2nd, 3rd, 4th
      // 4 -> 4th, 5th, 6th, 7th
      // 7 -> 7th, 8th, 9th, 10th
      let baseOffset = 1;
      if (currentDriveOffset >= 7) {
        baseOffset = 7;
      } else if (currentDriveOffset >= 4) {
        baseOffset = 4;
      } else {
        baseOffset = 1;
      }

      for (let i = 1; i <= 4; i++) {
        const btn = document.getElementById(`pagerBtn${i}`);
        const textElem = document.getElementById(`pagerText${i}`);
        const targetSlot = baseOffset + i - 1;

        if (btn) {
          btn.setAttribute("data-target-offset", targetSlot);
          if (targetSlot === currentDriveOffset) {
            btn.classList.add("active");
          } else {
            btn.classList.remove("active");
          }

          if (textElem) {
            textElem.textContent = `${targetSlot}${getOrdinal(targetSlot)}`;
          }
          btn.title = `Show from ${targetSlot}${getOrdinal(targetSlot)} Driver`;
        }
      }
    }

    function handlePagerClick(buttonIndex, event) {
      if (event) event.stopPropagation();
      const btn = document.getElementById(`pagerBtn${buttonIndex}`);
      if (!btn) return;
      const targetOffset = parseInt(btn.getAttribute("data-target-offset"), 10) || buttonIndex;

      // If clicking already-active start button (e.g. 4th when on 4-7, or 7th when on 7-10), toggle back to 1st page
      if (targetOffset === currentDriveOffset && targetOffset > 1) {
        setDriveOffset(1, event);
      } else {
        setDriveOffset(targetOffset, event);
      }
    }

    function getOrdinal(n) {
      const s = ["th", "st", "nd", "rd"];
      const v = n % 100;
      return s[(v - 20) % 10] || s[v] || s[0];
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function showDriveHoverPopup(drive, rowId) {
      const popup = document.getElementById("driveHoverPopup");
      if (!popup) return;
      if (!drive || !drive.meta) {
        hideDriveHoverPopup();
        return;
      }
      const meta = drive.meta;
      let html = `<div class="popup-title">${escapeHtml(meta.title)}</div><div class="popup-divider"></div>`;
      if (meta.is_parent) {
        html += `
          <div class="popup-row"><span class="popup-label">Location:</span><span class="popup-val">${escapeHtml(meta.location)}</span></div>
          <div class="popup-row"><span class="popup-label">Capacity:</span><span class="popup-val val-highlight">${escapeHtml(meta.capacity)}</span></div>
          <div class="popup-row"><span class="popup-label">Child Count:</span><span class="popup-val">${meta.child_count}</span></div>
          <div class="popup-row"><span class="popup-label">Type:</span><span class="popup-val val-type">${escapeHtml(meta.type)}</span></div>
        `;
      } else {
        const mountLabel = meta.drive_letter ? "Mount Path:" : "Mount Point:";
        html += `
          ${meta.drive_letter ? `<div class="popup-row"><span class="popup-label">Drive Letter:</span><span class="popup-val">${escapeHtml(meta.drive_letter)}</span></div>` : ''}
          <div class="popup-row vertical-wrap">
            <span class="popup-label">${mountLabel}</span>
            <span class="popup-val val-path">${escapeHtml(meta.mount_point)}</span>
          </div>
          <div class="popup-row"><span class="popup-label">Capacity:</span><span class="popup-val val-highlight">${escapeHtml(meta.capacity)}</span></div>
          <div class="popup-row"><span class="popup-label">Type:</span><span class="popup-val val-type">${escapeHtml(meta.type)}</span></div>
        `;
      }
      popup.innerHTML = html;
      popup.style.display = "block";
      popup.classList.add("visible");

      positionHoverPopup();
    }

    function positionHoverPopup() {
      const popup = document.getElementById("driveHoverPopup");
      const cardElem = document.querySelector(".card");
      const driversSec = document.querySelector(".drivers-section");
      if (!popup || !cardElem || !driversSec) return;

      const cardRect = cardElem.getBoundingClientRect();
      const driversRect = driversSec.getBoundingClientRect();
      const scale = currentScale || 1.0;

      // Fixed anchor position: directly below Drivers List (above Sleep controls)
      // Whichever disk is hovered, popup appears at this exact anchor spot.
      // This ensures all Drivers List rows, names, and cursor remain 100% visible!
      let fixedTop = Math.round((driversRect.bottom - cardRect.top) / scale + 2);
      if (isNaN(fixedTop) || fixedTop <= 0) {
        fixedTop = Math.round(driversSec.offsetTop + driversSec.offsetHeight + 2);
      }
      popup.style.top = `${fixedTop}px`;
    }

    function hideDriveHoverPopup() {
      const popup = document.getElementById("driveHoverPopup");
      if (popup) {
        popup.classList.remove("visible");
        popup.style.display = "none";
      }
    }

    function renderDriveNames() {
      for (let i = 1; i <= 4; i++) {
        const slotNum = currentDriveOffset + i - 1; // 1-based drive number
        const drive = currentDrives[slotNum - 1];
        const nameElem = document.getElementById(`driver${i}Name`);
        const cbElem = document.getElementById(`checkDriver${i}`);
        const wrapElem = nameElem ? nameElem.closest('.driver-name-wrap') : null;

        if (nameElem) {
          // Strictly remove title attribute to prevent duplicate browser/OS tooltip!
          nameElem.removeAttribute("title");
          if (wrapElem) wrapElem.removeAttribute("title");

          if (drive) {
            // Strictly System Device Identifier (e.g. "disk7", "disk8s1", "disk9s1", "PhysicalDrive1", "E:")
            const devId = (drive.id || drive.device_id || `disk${slotNum}`).replace(/^\/dev\//, '');
            nameElem.textContent = devId;

            // Bind single interactive hover popup
            if (wrapElem) {
              wrapElem.style.cursor = "pointer";
              wrapElem.onmouseenter = function() {
                showDriveHoverPopup(drive, i);
              };
              wrapElem.onmouseleave = function() {
                hideDriveHoverPopup();
              };
            }
          } else {
            nameElem.textContent = `disk${slotNum}`;
            if (wrapElem) {
              wrapElem.style.cursor = "default";
              wrapElem.onmouseenter = null;
              wrapElem.onmouseleave = null;
            }
          }
        }

        if (cbElem) {
          if (driverCheckStates[slotNum] === true) {
            cbElem.classList.remove("unchecked");
          } else {
            cbElem.classList.add("unchecked");
            driverCheckStates[slotNum] = false;
          }
        }
      }
      syncAllCheckboxState();
      updatePagerActiveState();
    }

    // Driver Checkbox States & Synchronization (by global slot number - default UNTICKED)
    const driverCheckStates = {};

    function getCheckedDriveTargets() {
      const targets = [];
      for (const slotStr in driverCheckStates) {
        if (driverCheckStates[slotStr] === true) {
          const slotNum = parseInt(slotStr, 10);
          const drive = currentDrives[slotNum - 1];
          if (drive && drive.id) {
            targets.push(drive.id.replace(/^\/dev\//, ''));
          }
        }
      }
      return targets;
    }

    function toggleDriverCheckbox(rowId) {
      const slotNum = currentDriveOffset + rowId - 1;
      const elem = document.getElementById(`checkDriver${rowId}`);
      if (!elem) return;

      const drive = currentDrives[slotNum - 1];
      const isNowChecked = elem.classList.contains("unchecked"); // will become checked
      driverCheckStates[slotNum] = isNowChecked;

      if (isNowChecked) {
        elem.classList.remove("unchecked");
      } else {
        elem.classList.add("unchecked");
      }

      // 1. Parent checkbox logic:
      // If toggled drive is a physical parent (e.g. disk7), toggle all its child partitions as well!
      if (drive && drive.is_parent && drive.child_ids && drive.child_ids.length > 0) {
        currentDrives.forEach((d, idx) => {
          const sNum = idx + 1;
          if (drive.child_ids.includes(d.id)) {
            driverCheckStates[sNum] = isNowChecked;
            const visibleRow = sNum - currentDriveOffset + 1;
            if (visibleRow >= 1 && visibleRow <= 4) {
              const childElem = document.getElementById(`checkDriver${visibleRow}`);
              if (childElem) {
                if (isNowChecked) childElem.classList.remove("unchecked");
                else childElem.classList.add("unchecked");
              }
            }
          }
        });
      }

      // 2. Child checkbox logic:
      // If toggled drive is a child partition, update its parent's check state
      if (drive && !drive.is_parent && drive.parent_id) {
        const parentIdx = currentDrives.findIndex(d => d.id === drive.parent_id && d.is_parent);
        if (parentIdx !== -1) {
          const parentSlot = parentIdx + 1;
          const parentDrive = currentDrives[parentIdx];
          const allChildrenChecked = parentDrive.child_ids && parentDrive.child_ids.length > 0 && parentDrive.child_ids.every(cid => {
            const cIdx = currentDrives.findIndex(cd => cd.id === cid);
            return cIdx !== -1 && driverCheckStates[cIdx + 1] === true;
          });
          driverCheckStates[parentSlot] = allChildrenChecked;
          const visibleParentRow = parentSlot - currentDriveOffset + 1;
          if (visibleParentRow >= 1 && visibleParentRow <= 4) {
            const pElem = document.getElementById(`checkDriver${visibleParentRow}`);
            if (pElem) {
              if (allChildrenChecked) pElem.classList.remove("unchecked");
              else pElem.classList.add("unchecked");
            }
          }
        }
      }

      syncAllCheckboxState();
      const targetId = drive ? (drive.id ? drive.id.replace(/^\/dev\//, '') : drive.uuid || drive.name) : `disk${slotNum}`;
      postToHost({ action: "driveSelection", driverId: targetId, slot: slotNum, checked: isNowChecked });
    }

    function toggleAllCheckbox() {
      const allElem = document.getElementById("checkDriverAll");
      if (!allElem) return;
      allElem.classList.toggle("unchecked");
      const isAllChecked = !allElem.classList.contains("unchecked");

      currentDrives.forEach((_, idx) => {
        driverCheckStates[idx + 1] = isAllChecked;
      });
      for (let i = 1; i <= 4; i++) {
        const slotNum = currentDriveOffset + i - 1;
        driverCheckStates[slotNum] = isAllChecked;
        const cb = document.getElementById(`checkDriver${i}`);
        if (cb) {
          if (isAllChecked) cb.classList.remove("unchecked");
          else cb.classList.add("unchecked");
        }
      }
      postToHost({ action: "driveSelectionAll", checked: isAllChecked });
    }

    function syncAllCheckboxState() {
      const allElem = document.getElementById("checkDriverAll");
      if (!allElem) return;
      let allChecked = true;
      for (let i = 1; i <= 4; i++) {
        const slotNum = currentDriveOffset + i - 1;
        if (!driverCheckStates[slotNum]) {
          allChecked = false;
          break;
        }
      }
      if (allChecked) {
        allElem.classList.remove("unchecked");
      } else {
        allElem.classList.add("unchecked");
      }
    }

    // Mount Handlers (Row-specific: mounts that specific slot/drive)
    function triggerMount(rowId) {
      if (rowId === 'all') {
        const checkedTargets = getCheckedDriveTargets();
        if (checkedTargets.length > 0) {
          startProcessingLoop("Mounting", checkedTargets.join(", "));
          postToHost({ action: "mount", target: "checked", drivers: checkedTargets });
        } else {
          startProcessingLoop("Mounting", "All Drivers");
          postToHost({ action: "mount", target: "all", drivers: [] });
        }
      } else {
        const slotNum = currentDriveOffset + rowId - 1;
        const drive = currentDrives[slotNum - 1];
        const devId = drive ? (drive.id ? drive.id.replace(/^\/dev\//, '') : `disk${slotNum}`) : `disk${slotNum}`;
        startProcessingLoop("Mounting", devId);
        postToHost({ action: "mount", target: devId, slot: slotNum });
      }
    }

    // Unmount Handlers (Row-specific: loops until unmount completes)
    function triggerUnmount(rowId) {
      if (rowId === 'all') {
        const checkedTargets = getCheckedDriveTargets();
        if (checkedTargets.length > 0) {
          startProcessingLoop("Unmounting", checkedTargets.join(", "));
          postToHost({ action: "unmount", target: "checked", drivers: checkedTargets });
        } else {
          startProcessingLoop("Safe Unmount", "All Managed Drives");
          postToHost({ action: "unmount", target: "all", drivers: [] });
        }
      } else {
        const slotNum = currentDriveOffset + rowId - 1;
        const drive = currentDrives[slotNum - 1];
        const devId = drive ? (drive.id ? drive.id.replace(/^\/dev\//, '') : `disk${slotNum}`) : `disk${slotNum}`;
        if (drive && drive.is_parent) {
          startProcessingLoop("Deep Sleep", devId);
        } else {
          startProcessingLoop("Unmounting", devId);
        }
        postToHost({ action: "unmount", target: devId, slot: slotNum });
      }
    }

    // Eject Now (Only ejects currently checked drivers with continuous loop until complete)
    function triggerEjectNow() {
      const checkedTargets = getCheckedDriveTargets();
      if (checkedTargets.length > 0) {
        startProcessingLoop("Ejecting Safely", checkedTargets.join(", "));
        postToHost({ action: "ejectNow", drivers: checkedTargets });
      } else {
        startProcessingLoop("Ejecting Safely", "All Checked");
        postToHost({ action: "ejectNow", drivers: [] });
      }
    }

    function syncEjectedCount(overrideCount = null) {
      const select = document.getElementById("ejectedDiskSelect");
      const checkElem = document.getElementById("ejectedDiskCheck");
      if (!select) return;

      let actualCount = 0;
      if (typeof overrideCount === "number") {
        actualCount = Math.max(0, overrideCount);
      } else {
        // Real dynamic calculation: count how many child partitions have mounted === false
        if (currentDrives && currentDrives.length > 0) {
          const childDrives = currentDrives.filter(d => !d.is_parent);
          const countSource = childDrives.length > 0 ? childDrives : currentDrives;
          actualCount = countSource.filter(d => d.mounted === false).length;
        }
      }

      // Always display real integer count (e.g. 0, 1, 2, 3...)
      const val = String(actualCount);
      if (!select.querySelector(`option[value="${val}"]`)) {
        const opt = document.createElement("option");
        opt.value = val;
        opt.textContent = val;
        select.appendChild(opt);
      }
      select.value = val;

      if (checkElem) {
        if (actualCount > 0) {
          checkElem.classList.remove("unchecked");
        } else {
          checkElem.classList.add("unchecked");
        }
      }
    }

    function handleEjectedSelectChange(val) {
      if (val === "0") {
        postToHost({ action: "mount", target: "all" });
      }
    }

    function changeSleepTimer(val) {
      postToHost({ action: "timer", preset: val });
    }

    function triggerCheckUpdate() {
      alert("You are running the latest version of Safe Drive Ejector Tool (v1.0.0).");
      postToHost({ action: "update" });
    }

    function triggerAboutModal() {
      alert("Safe Drive Ejector Tool (v1.0.0)\n\nCross-Platform Menu Bar Utility for Safe External SSD Ejection, Idle Sleep & Auto-Active Wake.\n\nGitHub: https://github.com/siraj-bd/Safe-Drive-Ejector-Tool");
    }

    function handleLogoutClick(event) {
      if (event) event.stopPropagation();
      triggerQuitApp();
    }

    document.addEventListener("DOMContentLoaded", () => {
      const btn = document.getElementById("logoutBtn");

      // Close expanded pager button when clicking outside
      document.addEventListener("click", () => {
        const pager = document.getElementById("driverPagerBtn");
        if (pager) pager.classList.remove("expanded");
      });

      // Mouse wheel scrolling for Drivers List section - rolls count and BSD names serial-wise
      const driversSec = document.querySelector(".drivers-section");
      if (driversSec) {
        driversSec.addEventListener("wheel", (e) => {
          e.preventDefault();
          if (e.deltaY > 6) {
            setDriveOffset(Math.min(currentDriveOffset + 1, Math.max(1, (currentDrives.length || 8) - 1)));
          } else if (e.deltaY < -6) {
            setDriveOffset(Math.max(1, currentDriveOffset - 1));
          }
        }, { passive: false });
      }

      // Initialize Card Scale (persisted or default 1X)
      const savedScale = localStorage.getItem("SafeDriveEjector_CardScale");
      if (savedScale) {
        changeCardScale(savedScale);
      } else {
        changeCardScale(1.0);
      }

      // If standalone preview in browser, initialize realistic drives with BSD names matching System Information
      if (!window.webkit || !window.webkit.messageHandlers || !window.webkit.messageHandlers.safeEjectBridge) {
        window.updateUIState({
          external_drives: [
            {
              id: "disk7",
              name: "StoreJet Transcend Media",
              location: "External",
              decimal_size: "480.1 GB",
              child_count: 3,
              media_type: "Solid state",
              volumes: [
                { device_id: "disk8s1", name: "support-external-drive", mount_point: "/Volumes/support-external-drive", decimal_size: "200.39 GB", type_desc: "APFS Volume", is_mounted: true },
                { device_id: "disk9s1", name: "Macbook Backup", mount_point: "/Volumes/Macbook Backup", decimal_size: "279.5 GB", type_desc: "APFS Volume", is_mounted: true },
                { device_id: "disk10s1", name: "USBTest", mount_point: "/Volumes/USBTest", decimal_size: "500 MB", type_desc: "FAT32", is_mounted: false },
                { device_id: "disk11s1", name: "Samsung T7", mount_point: "/Volumes/Samsung T7", decimal_size: "1.0 TB", type_desc: "APFS Volume", is_mounted: true },
                { device_id: "disk12s1", name: "Extreme SSD 1TB", mount_point: "/Volumes/Extreme SSD 1TB", decimal_size: "1.0 TB", type_desc: "APFS Volume", is_mounted: true },
                { device_id: "disk13s1", name: "Work Docs", mount_point: "/Volumes/Work Docs", decimal_size: "256 GB", type_desc: "ExFAT", is_mounted: false }
              ]
            }
          ]
        });
      }
    });

    function triggerQuitApp() {
      postToHost({ action: "quit" });
    }

    // Communication with Swift Host / Python
    function postToHost(data) {
      if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.safeEjectBridge) {
        window.webkit.messageHandlers.safeEjectBridge.postMessage(data);
      } else {
        console.log("[SafeEject Webview IPC]:", data);
      }
    }

    // Live State Injection from Host
    window.updateUIState = function(state) {
      if (!state) return;

      if (state.external_drives && Array.isArray(state.external_drives)) {
        const drives = [];
        // Sort physical external drives by ID (e.g. disk7 before disk10)
        const sortedExternal = [...state.external_drives].sort((a, b) => {
          return (a.id || "").localeCompare(b.id || "", undefined, { numeric: true, sensitivity: 'base' });
        });

        sortedExternal.forEach(d => {
          const parentId = (d.id || "").replace(/^\/dev\//, '');
          const validChildVolumes = (d.volumes || []).filter(v => v.name !== "EFI" && v.fs_type !== "Apple_APFS");
          const childIds = validChildVolumes.map(v => (v.device_id || "").replace(/^\/dev\//, ''));

          // 1. Physical parent device (Disk 1: disk7)
          if (parentId) {
            drives.push({
              id: parentId,
              name: parentId,
              is_parent: true,
              parent_id: parentId,
              child_ids: childIds,
              mounted: validChildVolumes.length > 0 ? validChildVolumes.some(v => v.is_mounted) : (d.is_mounted !== false),
              uuid: d.primary_uuid || parentId,
              meta: {
                is_parent: true,
                title: d.name || parentId,
                location: d.location || (d.is_external ? "External" : "Internal"),
                capacity: d.decimal_size || d.human_size || "Unknown",
                child_count: d.child_count || (d.volumes ? d.volumes.length : childIds.length) || childIds.length,
                type: d.media_type || "Solid state",
              }
            });
          }

          // 2. Child partitions in sequence (Disk 2: disk8s1, Disk 3: disk9s1...)
          validChildVolumes.forEach(v => {
            const childId = (v.device_id || "").replace(/^\/dev\//, '');
            if (childId && childId !== parentId) {
              drives.push({
                id: childId,
                name: childId,
                is_parent: false,
                parent_id: parentId,
                child_ids: [],
                mounted: v.is_mounted === true,
                uuid: v.uuid || childId,
                meta: {
                  is_parent: false,
                  title: v.name || childId,
                  mount_point: v.mount_point || (v.is_mounted ? (childId.includes(":") ? childId + "\\" : `/Volumes/${v.name || childId}`) : "Not mounted"),
                  drive_letter: v.drive_letter || (childId.includes(":") ? childId : ""),
                  capacity: v.decimal_size || v.human_size || "Unknown",
                  type: v.type_desc || v.fs_type || "Volume",
                }
              });
            }
          });
        });

        currentDrives = drives;
        renderDriveNames();
      }

      if (state.ejected_count !== undefined) {
        syncEjectedCount(state.ejected_count);
      } else if (state.ejectedCount !== undefined) {
        syncEjectedCount(state.ejectedCount);
      } else {
        syncEjectedCount();
      }

      if (state.config) {
        const cfg = state.config;
        const setCb = (id, val) => {
          const el = document.getElementById(id);
          if (el) {
            if (val) el.classList.remove("unchecked");
            else el.classList.add("unchecked");
          }
        };
        setCb("autoAwakeCheck", cfg.remount_on_wake !== false);
        setCb("startAtLoginCheck", cfg.start_at_login !== false);
        setCb("beforeSleepCheck", cfg.eject_on_sleep !== false);
        setCb("beforeLogoutCheck", cfg.eject_before_logout === true);

        if (cfg.sleep_timer_seconds !== undefined) {
          const timerSelect = document.getElementById("sleepTimerSelect");
          if (timerSelect) {
            const sec = cfg.sleep_timer_seconds;
            if (sec <= 0) timerSelect.value = "never";
            else if (sec === 120) timerSelect.value = "2m";
            else if (sec === 300) timerSelect.value = "5m";
            else if (sec === 600) timerSelect.value = "10m";
            else if (sec === 900) timerSelect.value = "15m";
            else if (sec === 1800) timerSelect.value = "30m";
            else if (sec === 3600) timerSelect.value = "1h";
            else if (sec === 7200) timerSelect.value = "2h";
          }
        }
      } else if (state.sleepTimer) {
        const timerSelect = document.getElementById("sleepTimerSelect");
        if (timerSelect) timerSelect.value = state.sleepTimer;
      }
    };
  </script>
</body>
</html>
