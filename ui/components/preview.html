<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Safe Drive Ejector Tool — Menu Bar & Card Preview</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #1e1e24 0%, #0d0e12 100%);
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow-x: hidden;
    }

    /* ==========================================================================
       SIMULATED MACOS TOP MENU BAR
       ========================================================================== */
    .macos-menubar {
      width: 100%;
      height: 38px;
      background: rgba(20, 20, 24, 0.75);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      z-index: 100;
      position: fixed;
      top: 0;
      left: 0;
    }

    .menubar-left {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
    }
    .apple-logo {
      font-size: 15px;
      cursor: pointer;
    }
    .menubar-app-title {
      font-weight: 700;
    }
    .menubar-nav-item {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.8);
      cursor: pointer;
      font-weight: 400;
    }

    .menubar-right {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 12.5px;
      color: rgba(255, 255, 255, 0.85);
    }

    /* ==========================================================================
       MENUBAR TOGGLE ICON (From Uiverse.io by elijahgummer - shy-fireant-5)
       Customized: Odd purple replaced with Glowing Neon Red & Frosted White!
       ========================================================================== */
    .square-toggle-container {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
      transition: background 0.2s ease;
    }
    .square-toggle-container:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .square {
      border: 1.5px solid #ff3333;
      height: 22px;
      width: 22px;
      display: block;
      margin: 0 auto;
      transform: rotate(45deg);
      overflow: hidden;
      cursor: pointer;
      transition: all 450ms cubic-bezier(0.97, 0, 0.395, 0.995);
      box-shadow: none;
    }

    .square .burgerwrap {
      height: 16px;
      width: 18px;
      transform: rotate(-45deg);
      padding-left: 2px;
      padding-top: 6px;
      transition: all 450ms cubic-bezier(0.97, 0, 0.395, 0.995);
    }

    /* Inactive State: Red Bars */
    .square span {
      height: 2px;
      width: 12px;
      background: #ff3333;
      display: block;
      margin-bottom: 2px;
      transition: all 450ms cubic-bezier(0.97, 0, 0.395, 0.995);
    }

    .square span:after {
      content: "";
      height: 2px;
      width: 12px;
      position: absolute;
      background: #64FD1F;
      left: -20px;
      margin-top: -4px;
      transition: all 450ms cubic-bezier(0.97, 0, 0.395, 0.995);
    }

    /* Active State (Card Open): Turns GREEN, Rotates, No Glow */
    .square.active {
      transform: rotate(135deg);
      border-color: #64FD1F;
      box-shadow: none;
    }

    .square.active .burgerwrap {
      transform: rotate(-135deg);
    }

    .square.active span {
      margin-left: 20px;
      background: #64FD1F;
    }

    .square.active span:after {
      left: 0.2px;
      background: #64FD1F;
    }

    .square:hover {
      filter: brightness(1.2);
    }

    .square span:nth-of-type(1),
    .square span:nth-of-type(1):after {
      transition-delay: 0.08s;
    }

    .square span:nth-of-type(2),
    .square span:nth-of-type(2):after {
      transition-delay: 0.16s;
    }

    .square span:nth-of-type(3),
    .square span:nth-of-type(3):after {
      transition-delay: 0.24s;
    }

    /* Popover Positioning Container */
    .popover-container {
      position: fixed;
      top: 46px;
      right: 28px;
      z-index: 99;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      transform-origin: top right;
      opacity: 1;
      transform: scale(1) translateY(0);
    }
    .popover-container.hidden {
      opacity: 0;
      transform: scale(0.92) translateY(-12px);
      pointer-events: none;
    }

    /* Frame housing the SafeDriveEjectorCard component */
    .card-frame {
      width: 210px;
      height: 420px;
      border: none;
      background: transparent;
      overflow: hidden;
    }

    /* Info Badge on screen */
    .hint-banner {
      margin-top: 60px;
      margin-bottom: 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 13px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hint-banner b {
      color: #ff3333;
    }
  </style>
</head>
<body>

  <!-- macOS Top Menubar Simulation -->
  <div class="macos-menubar">
    <div class="menubar-left">
      <span class="apple-logo"></span>
      <span class="menubar-app-title">Antigravity</span>
      <span class="menubar-nav-item">File</span>
      <span class="menubar-nav-item">Edit</span>
      <span class="menubar-nav-item">View</span>
      <span class="menubar-nav-item">Window</span>
    </div>

    <div class="menubar-right">
      <!-- Menubar Toggle Icon (shy-fireant-5 by elijahgummer) -->
      <div class="square-toggle-container" onclick="togglePopover()" title="Click to toggle Safe Drive Ejector Tool">
        <div class="square active" id="menuToggleIcon">
          <div class="burgerwrap">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>

      <span>100%</span>
      <span>Mon 21 Sep 7:45 PM</span>
    </div>
  </div>

  <div class="hint-banner">
    💡 Click the <b>rotating diamond toggle icon</b> in the top-right menu bar to show or hide the tool!
  </div>

  <!-- Popover Panel displaying SafeDriveEjectorCard -->
  <div class="popover-container" id="popoverPanel">
    <iframe class="card-frame" src="SafeDriveEjectorCard.html" scrolling="no"></iframe>
  </div>

  <script>
    function togglePopover() {
      const panel = document.getElementById("popoverPanel");
      const icon = document.getElementById("menuToggleIcon");
      panel.classList.toggle("hidden");
      icon.classList.toggle("active");
    }
  </script>
</body>
</html>
