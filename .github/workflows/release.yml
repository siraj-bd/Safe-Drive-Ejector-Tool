name: Multi-Platform Release (macOS & Windows)

'on':
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish as GitHub Release draft/tag'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. Automated Test Suite (macOS & Windows)
  # ============================================================================
  test:
    name: Run Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ['3.11']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run Core & Feature Unit Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Run Deep Sleep Isolation Tests
        run: |
          python -m unittest tests.test_deep_sleep_auto_wake_isolation

  # ============================================================================
  # 2. Build macOS Standalone App & DMG (arm64 & x86_64)
  # ============================================================================
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-15-intel
            arch: x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip pyinstaller

      - name: Build macOS App Bundle and DMG
        env:
          DMG_NAME: SafeDriveEjector-1.0.0-macOS-${{ matrix.arch }}.dmg
        run: |
          chmod +x build_macos.sh
          ./build_macos.sh

      - name: Optional Code Signing (Hardened Runtime)
        if: env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          echo "Signing certificate detected. Running codesign..."
          # codesign hook for future Developer ID deployment

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SafeDriveEjector-macOS-${{ matrix.arch }}
          path: dist/SafeDriveEjector-1.0.0-macOS-${{ matrix.arch }}.dmg
          if-no-files-found: error

  # ============================================================================
  # 3. Build Windows Standalone System Tray App & ZIP (x64)
  # ============================================================================
  build-windows:
    name: Build Windows (x64)
    needs: test
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install packaging dependencies
        run: |
          python -m pip install --upgrade pip pyinstaller pystray pillow

      - name: Build Windows Standalone Executables and Archive
        run: |
          cmd /c build_windows.bat

      - name: Optional Authenticode Code Signing
        if: env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          echo "Windows certificate detected. Running signtool..."
          # signtool hook for future Authenticode deployment

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeDriveEjector-Windows-x64
          path: dist/SafeDriveEjector-1.0.0-Windows.zip
          if-no-files-found: error

  # ============================================================================
  # 4. Publish Release to GitHub Releases
  # ============================================================================
  publish-release:
    name: Publish Release Assets
    needs: [build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List downloaded release assets
        run: |
          ls -lh release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.dmg
            release-artifacts/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
